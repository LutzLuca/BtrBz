name: build
on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  scripts:
    name: script checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun run check
        working-directory: scripts

  build:
    name: build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle
      - name: format, lint, test, and build all targets
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: versions/*/build/libs/*.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: capture verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          overwrite: true
          path: |
            build/reports/
            versions/*/build/reports/
          retention-days: 7
