name: release
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

# Never interrupt a run that may already have published to one provider.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: require a commit on master
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Release tags must point to a commit on master."
            exit 1
          fi
      - uses: ./.github/actions/setup-gradle
      - uses: ./.github/actions/setup-bun
      - name: check scripts
        working-directory: scripts
        run: bun run check
      - name: prepare changelog
        run: |
          bash scripts/extract-latest-changes.sh
          version=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG_LATEST.md | head -n 1)
          if [ -z "$version" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag does not match the latest changelog."
            exit 1
          fi
      - name: format, lint, test, and build all targets
        run: ./gradlew build
      - name: publish to GitHub and Modrinth
        run: ./gradlew releaseMod
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      - name: announce release
        working-directory: scripts
        run: bun run discord-release
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_RELEASE_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
